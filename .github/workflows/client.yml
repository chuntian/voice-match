name: Client CI

on:
  push:
    paths:
      - 'client/**'
      - 'shared/**'
  pull_request:
    paths:
      - 'client/**'
      - 'shared/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: cd client && flutter pub get

      - name: Analyze
        run: cd client && flutter analyze

      - name: Run tests
        run: cd client && flutter test

      - name: Build APK (debug)
        run: cd client && flutter build apk --debug

      - name: Build iOS (debug, no codesign)
        run: cd client && flutter build ios --debug --no-codesign
