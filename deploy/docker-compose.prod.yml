# Voice Match 生产环境覆盖文件
# 使用：docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:
  redis:
    # 生产：不暴露端口，AOF 持久化 + 内存限制由 redis.conf 控制
    ports: !reset []
    command:
      - redis-server
      - /etc/redis/redis.conf
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    deploy:
      resources:
        limits:
          memory: 320M

  mysql:
    # 生产：不对外暴露端口
    ports: !reset []
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --slow-query-log=1
      - --long-query-time=1
    deploy:
      resources:
        limits:
          memory: 1G

  signal:
    # 生产：2 副本，资源限制
    ports:
      # 仅通过 nginx 暴露，这里不直接对外
      - "127.0.0.1:8080:8080"
    environment:
      VM_APP_DEV_MODE: "false"
      VM_LOG_LEVEL: "info"
      VM_JWT_SECRET: "${VM_JWT_SECRET}"
      VM_FCM_SERVER_KEY: "${VM_FCM_SERVER_KEY}"
      VM_APNS_PRIVATE_KEY_PATH: "/secrets/AuthKey.p8"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 128M

  # 生产网关
  nginx:
    image: nginx:1.25-alpine
    container_name: vm-nginx
    restart: unless-stopped
    depends_on:
      - signal
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - voicematch-net
