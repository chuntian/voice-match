# Voice Match Redis 配置
bind 0.0.0.0
port 6379

# 持久化：AOF
appendonly yes
appendfsync everysec

# 内存策略
maxmemory 256mb
maxmemory-policy allkeys-lru

# 连接管理
timeout 300
tcp-keepalive 60

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128

# 安全提示：生产环境应配置 requirepass
# requirepass your-password-here

# 数据目录
dir /data
